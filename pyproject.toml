[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorgrad"
version = "0.1.0"
description = "A small deep-learning framework with reverse-mode autodiff, written from scratch in NumPy."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
viz = ["graphviz>=0.20", "matplotlib>=3.8"]
dev = ["pytest>=8", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
